# Zatím jen Neo4j pro krok 3 (graph write). Aplikace samotná se spouští lokálně přes `bun run dev`.
# Kredence odpovídají výchozím hodnotám v .env.example (NEO4J_USER=neo4j, NEO4J_PASSWORD=community-graph-dev).
services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/community-graph-dev
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  neo4j-data:
